name: Create Feature Branch with Specific Files

on:
  push:
    branches:
      - FSB  # Trigger workflow on push to the main branch
permissions:
  contents: write

jobs:
  create-feature-branch:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Set up Git user details
      - name: Set up Git user
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@example.com"

      # Step 3: Get a list of changed files
      - name: Get changed files
        id: diff
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1..HEAD)
          # Convert newline-separated file list into a space-separated list
          CHANGED_FILES=$(echo "$CHANGED_FILES" | tr '\n' ' ')  # Replace newline with space
          # Ensure no leading/trailing spaces in the file paths
          CHANGED_FILES=$(echo "$CHANGED_FILES" | sed 's/^ *//;s/ *$//')
          echo "CHANGED_FILES=$CHANGED_FILES" >> $GITHUB_ENV
          echo "Changed files: $CHANGED_FILES"

      # Step 4: Debugging - Print out the changed file paths
      - name: Debugging - Print changed file paths
        run: |
          echo "Changed files: $CHANGED_FILES"
          # Use IFS (Internal Field Separator) to handle file paths containing spaces
          IFS=' '  # Space as separator to handle file paths one by one
          for file in $CHANGED_FILES; do
            # Ensure there is no extra space before processing
            trimmed_file=$(echo "$file" | sed 's/^ *//;s/ *$//')  # Remove leading/trailing spaces
            echo "Checking out file: '$trimmed_file'"
            # Ensure file exists
            if [ ! -e "$trimmed_file" ]; then
              echo "ERROR: File '$trimmed_file' does not exist in the repository!"
            fi
          done

      # Step 5: Generate unique branch name
      - name: Generate unique branch name
        id: branch_name
        run: |
          DATE=$(date +%Y%m%d-%H%M%S)
          BRANCH_NAME="feature-${DATE}"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          echo "Branch name: $BRANCH_NAME"

      # Step 6: Create a new branch
      - name: Create new feature branch
        run: |
          git checkout -b $BRANCH_NAME
          CHANGED_FILES=$CHANGED_FILES
          # Remove all files from the current branch, then checkout only the changed files
          git rm -rf .  # Remove all files from the working tree
          # Use IFS to loop through each file path with spaces correctly
          IFS=' '  # Use space as separator
          for file in $CHANGED_FILES; do
            # Remove leading/trailing spaces from each file
            trimmed_file=$(echo "$file" | sed 's/^ *//;s/ *$//')  # Remove leading/trailing spaces
            echo "Checking out file: '$trimmed_file'"
            git checkout HEAD -- "$trimmed_file"  # Checkout the file properly
          done
          # Stage the changes and commit them
          git add .
          git commit -m "Create feature branch with specific files: $CHANGED_FILES"

      # Step 7: Push the feature branch to the repository
      - name: Push the feature branch
        run: |
          git push origin $BRANCH_NAME


