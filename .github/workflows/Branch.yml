name: Create Feature Branch with Specific Files

on:
  push:
    branches:
      - FSB  # Trigger workflow on push to the FSB branch

permissions:
  contents: write

jobs:
  create-feature-branch:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Set up Git user details
      - name: Set up Git user
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@example.com"

      # Step 3: Get a list of changed files
      - name: Get changed files
        id: diff
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1..HEAD)
          CHANGED_FILES=$(echo "$CHANGED_FILES" | tr '\n' ' ')  # Replace newlines with spaces
          echo "CHANGED_FILES=$CHANGED_FILES" >> $GITHUB_ENV
          echo "Changed files: $CHANGED_FILES"

      # Step 4: Generate unique branch name
      - name: Generate unique branch name
        id: branch_name
        run: |
          DATE=$(date +%Y%m%d-%H%M%S)
          BRANCH_NAME="feature-${DATE}"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          echo "Branch name: $BRANCH_NAME"

      # Step 5: Create a new feature branch and checkout only changed files
      - name: Create new feature branch
        run: |
          git checkout -b $BRANCH_NAME
          CHANGED_FILES=$CHANGED_FILES

          # Handle filenames with spaces by splitting into an array
          IFS=$'\n' read -r -d '' -a files <<< "$CHANGED_FILES"

          # Checkout only the changed files
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "Processing file: $file"
              git checkout HEAD -- "$file"
            fi
          done

          # Stage the changes
          git add .

      # Step 6: Commit changes if there are any
      - name: Commit changes
        run: |
          # Check if there are any staged changes
          git diff --cached --quiet || git commit -m "Create feature branch with specific files: $CHANGED_FILES"

      # Step 7: Push the new feature branch to the repository
      - name: Push the feature branch
        run: |
          git push origin $BRANCH_NAME
