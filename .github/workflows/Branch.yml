name: Create Feature Branch with Specific Files

on:
  push:
    branches:
      - FSB  # Trigger workflow on push to the main branch
    paths-ignore:
      - '.github/workflows/**'
permissions:
  contents: write

jobs:
  create-feature-branch:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Set up Git user details
      - name: Set up Git user
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@example.com"
          
      # Step 3: Get a list of changed files
      - name: Get changed files
        id: diff
        run: |
          # Get the list of changed files between HEAD~1 and HEAD (this represents the last commit)
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR HEAD~1..HEAD)
          # Store the list in an environment variable to use in subsequent steps
          echo "CHANGED_FILES=$CHANGED_FILES" >> $GITHUB_ENV
          echo "Changed files: $CHANGED_FILES"
          
      # Step 4: Create and checkout the new branch
      - name: Create and checkout new feature branch
        run: |
          # Generate unique branch name
          DATE=$(date +%Y%m%d-%H%M%S)
          BRANCH_NAME="feature-${DATE}"
          echo "Generated Branch Name: $BRANCH_NAME"  # Debugging line to check the branch name
          # Create a new branch and checkout
          git checkout -b "$BRANCH_NAME"
          echo "Created and checked out branch: $BRANCH_NAME"
          
      # Step 5: Remove all files from the working directory
      - name: Remove all files
        run: |
          git rm -rf .
          echo "Removed all files from the working directory"
          
      # Step 6: Restore changed files
      - name: Checkout changed files
        run: |
          set -x
          # Get the changed files list from the environment variable
          CHANGED_FILES="${{ env.CHANGED_FILES }}"
          
          # Check if CHANGED_FILES is empty
          if [ -n "$CHANGED_FILES" ]; then
            # Split the files into an array using newline as delimiter to handle spaces
            IFS=$'\n' read -r -d '' -a files <<< "$CHANGED_FILES"
            
            # Process each file and checkout from HEAD
            for file in "${files[@]}"; do
              echo "Processing file: $file"
              git checkout HEAD -- "$file"
            done
          else
            echo "No changed files to restore."
          fi
          
      # Step 7: Add the changed files back to the staging area
      - name: Add changed files back
        run: |
          git add .
          echo "Added changed files back to staging area"
          
      # Step 8: Commit the changes
      - name: Commit the changes
        run: |
          git commit -m "Create feature branch with specific files"
          
      # Step 9: Push the new feature branch to the repository
      - name: Push the feature branch
        run: |
          echo "Pushing branch: $BRANCH_NAME"  # Debugging line to check the branch name being pushed
          git push origin "$BRANCH_NAME"
          echo "Pushed the branch: $BRANCH_NAME"
