name: Create Issue and Set Project Status

on:
  workflow_dispatch:
    inputs:
      issue_title:
        description: "Title of the issue"
        required: true
      issue_body:
        description: "Issue body"
        required: false
        default: ""
      project_title:
        description: "Project V2 title (exact match)"
        required: true
      status_option:
        description: "Status (e.g., Todo, In Progress)"
        required: true

jobs:
  process-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Project ID
        id: get_project
        run: |
          query='query { viewer { projectsV2(first: 20) { nodes { id title } } }'
          result=$(gh api graphql -f query="$query")
          project_id=$(echo "$result" | jq -r --arg title "${{ github.event.inputs.project_title }}" '.data.viewer.projectsV2.nodes[] | select(.title == $title) | .id')
          if [ -z "$project_id" ]; then
            echo "Error: Project not found"
            exit 1
          fi
          echo "project_id=$project_id" >> $GITHUB_OUTPUT
          github-token: ${{ secrets.GH_PAT }}
      - name: Create Issue
        id: create_issue
        run: |
          response=$(gh issue create --title "${{ github.event.inputs.issue_title }}" --body "${{ github.event.inputs.issue_body }}" --json node_id)
          echo "node_id=$(echo "$response" | jq -r '.node_id')" >> $GITHUB_OUTPUT

      - name: Add Issue to Project
        id: add_to_project
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.projects.addProjectItem({
              project_id: ${{ steps.get_project.outputs.project_id }},
              content_id: ${{ steps.create_issue.outputs.node_id }},
              content_type: 'Issue',
            })
          github-token: ${{ secrets.GH_PAT }}

      # - name: Update Status Field
      #   uses: alex-page/update-project-v2-item-field@v2
      #   with:
      #     project-id: ${{ steps.get_project.outputs.project_id }}
      #     item-id: ${{ steps.add_to_project.outputs.itemId }}
