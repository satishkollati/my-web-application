name: On PR Merge - Create Issue & Add to Project
on:
  pull_request:
    types: [closed]

jobs:
  handle-merged-pr:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      # Create issue using GitHub CLI
      - name: Create Issue
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}  # PAT needs 'repo' scope
        run: |
          gh issue create \
            --title "Follow-up from PR #${{ github.event.pull_request.number }}" \
            --body "Merged PR: ${{ github.event.pull_request.title }}\n\n${{ github.event.pull_request.html_url }}" \
            --label "auto-created"

      # Add to project using GitHub's official action
      - name: Add to Project
        uses: actions/add-to-project@v0.6.0
        with:
          project-url: https://github.com/orgs/YOUR_ORG/projects/PROJECT_NUMBER
          github-token: ${{ secrets.PAT }}  # PAT needs 'project' scope
          labeled: "auto-created"

      # Simple deployment example (customize this)
      - name: Deploy
        run: |
          echo "🚀 Starting deployment..."
          # Add your actual deployment commands here
