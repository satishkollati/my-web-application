name: Create Issue and Set Project Status

on:
  workflow_dispatch:
    inputs:
      issue_title:
        description: "Title of the issue"
        required: true
      issue_body:
        description: "Issue body"
        required: false
        default: ""
      project_title:
        description: "Project V2 title (exact match)"
        required: true
      status_option:
        description: "Status (e.g., Todo, In Progress)"
        required: true

jobs:
  process-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      # Correct permission syntax for projects:
      contents: read
      packages: read
      # For organization projects:

    env:
      GH_TOKEN: ${{ secrets.GH_PAT || github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Project ID
        id: get_project
        run: |
          gh auth status || gh auth login --with-token <<< "$GH_TOKEN"
          
          query='query {
            viewer {
              projectsV2(first: 20) {
                nodes {
                  id
                  title
                }
              }
              organizations(first: 5) {
                nodes {
                  projectsV2(first: 20) {
                    nodes {
                      id
                      title
                    }
                  }
                }
              }
            }
          }'
          
          result=$(gh api graphql -f query="$query")
          project_id=$(echo "$result" | jq -r --arg title "${{ inputs.project_title }}" '
            .data.viewer.projectsV2.nodes[] | select(.title == $title) | .id // 
            .data.viewer.organizations.nodes[].projectsV2.nodes[] | select(.title == $title) | .id
          ')
          
          if [ -z "$project_id" ]; then
            echo "::error::Project not found"
            echo "$result" | jq .
            exit 1
          fi
          echo "project_id=$project_id" >> $GITHUB_OUTPUT

      # Rest of your steps remain the same...
